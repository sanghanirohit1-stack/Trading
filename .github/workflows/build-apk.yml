name: Build Trading Journal APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: 'platform-tools'

  - name: Install Android SDK packages
    run: |
      sdkmanager "platforms;android-36" "build-tools;36.0.0"

  - name: Install dependencies
    run: npm install

  - name: Prepare web files
    run: |
      mkdir -p www
      rsync -av --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.ts' ./ www/

  - name: Add Android platform
    run: npx cap add android

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: trading-journal-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
